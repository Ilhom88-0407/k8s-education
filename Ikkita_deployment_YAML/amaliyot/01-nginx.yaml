# Ikkinchi ilova: oddiy nginx.
#
# Bu servis TASHQARIGA CHIQMAYDI — u faqat klaster ichidan, ya'ni
# k8s-web-to-nginx ilovasidan chaqiriladi. Shuning uchun turi ClusterIP.
#
# Service nomi ataylab qisqa — `nginx`. Chunki ikkinchi ilova kodida
# aynan `http://nginx` deb yozilgan.
#
# Qo'llash: kubectl apply -f 01-nginx.yaml
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  replicas: 5
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests: { memory: 32Mi, cpu: 50m }
            limits: { memory: 128Mi, cpu: 125m }
