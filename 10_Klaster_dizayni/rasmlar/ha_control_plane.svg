<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880"
     role="img" aria-labelledby="sarlavha izoh" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title id="sarlavha">Yuqori mavjudlik (HA): nega uchta control plane kerak</title>
  <desc id="izoh">Bitta control plane node yiqilsa, klasterni boshqarish to&#x27;xtaydi. Uchta node bo&#x27;lsa, bittasi yiqilganda qolgan ikkitasi etcd uchun kvorum (2 dan 3) hosil qiladi va klaster ishlashda davom etadi. Shuning uchun control plane nodelar soni doim toq bo&#x27;lishi kerak.</desc>
  <defs>
    <marker id="ok1A1A18" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A18"/>
    </marker>
    <marker id="ok2A7D53" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2A7D53"/>
    </marker>
    <marker id="ok2C6FB5" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2C6FB5"/>
    </marker>
    <marker id="ok5B4FBE" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
