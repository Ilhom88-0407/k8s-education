  <text x="440" y="383" text-anchor="middle" font-size="11" fill="#5C5A55">Har revision saqlanadi, shuning uchun oldingi holatga qaytish bitta buyruq. kubectl bilan qo&#x27;lda qaytarishda esa qaysi fayl qanday edi — o&#x27;zingiz eslashingiz kerak.</text>
