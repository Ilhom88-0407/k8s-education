  <rect x="0" y="0" width="860" height="470" rx="14" fill="#FBFBFA" stroke="#D8D6D1" stroke-width="1"/>
  <text x="28" y="36" font-size="20" font-weight="600" fill="#1A1A18">Service → EndpointSlice → Pod</text>
  <text x="28" y="59" font-size="12.5" fill="#5C5A55">Selektor mos kelgan Pod ro&#x27;yxatga tushadi, kelmagani tushmaydi</text>
  <rect x="28" y="86" width="186" height="62" rx="8" fill="#FFFFFF" stroke="#D8D6D1" stroke-width="1.5"/>
  <text x="121" y="116" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A1A18">Mijoz Pod</text>
  <text x="121" y="133" text-anchor="middle" font-size="11" fill="#5C5A55">curl http://web-svc</text>
  <path d="M 214 117 L 300 117" stroke="#5B4FBE" stroke-width="2" fill="none" marker-end="url(#ok5B4FBE)"/>
  <text x="257" y="108" text-anchor="middle" font-size="11" fill="#5B4FBE">DNS so&#x27;rovi</text>
  <rect x="304" y="82" width="246" height="70" rx="8" fill="#E5E2F7" stroke="#5B4FBE" stroke-width="1.5"/>
  <text x="427" y="109" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A1A18">Service: web-svc</text>
  <text x="427" y="126" text-anchor="middle" font-size="11" fill="#5C5A55">ClusterIP 10.96.0.15:80</text>
  <text x="427" y="141" text-anchor="middle" font-size="11" fill="#5C5A55">selector: app=web</text>
  <path d="M 427 152 L 427 186" stroke="#5B4FBE" stroke-width="2" fill="none" marker-end="url(#ok5B4FBE)"/>
  <rect x="304" y="188" width="246" height="66" rx="8" fill="#E5E2F7" stroke="#5B4FBE" stroke-width="1.5"/>
  <text x="427" y="213" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A1A18">EndpointSlice</text>
  <text x="427" y="230" text-anchor="middle" font-size="11" fill="#5C5A55">Selektorga mos TAYYOR Podlar</text>
  <text x="427" y="245" text-anchor="middle" font-size="11" fill="#5C5A55">IP ro&#x27;yxati</text>
  <rect x="600" y="82" width="232" height="172" rx="8" fill="#DCE9F7" stroke="#2C6FB5" stroke-width="1.5"/>
  <text x="716" y="145" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A1A18">kube-proxy</text>
  <text x="716" y="162" text-anchor="middle" font-size="11" fill="#5C5A55">Har node&#x27;da ishlaydi.</text>
  <text x="716" y="177" text-anchor="middle" font-size="11" fill="#5C5A55">EndpointSlice o&#x27;zgarsa,</text>
  <text x="716" y="192" text-anchor="middle" font-size="11" fill="#5C5A55">iptables/IPVS qoidalarini</text>
  <text x="716" y="207" text-anchor="middle" font-size="11" fill="#5C5A55">qayta yozadi.</text>
  <path d="M 596 168 L 554 168" stroke="#2C6FB5" stroke-width="2" fill="none" marker-end="url(#ok2C6FB5)"/>
  <text x="28" y="296" font-size="12.5" font-weight="600" fill="#1A1A18">Klasterdagi Podlar:</text>
  <rect x="28" y="314" width="168" height="92" rx="8" fill="#DDF0E5" stroke="#2A7D53" stroke-width="1.5"/>
  <text x="112" y="344" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A1A18">Pod A</text>
  <text x="112" y="361" text-anchor="middle" font-size="11" fill="#5C5A55">app=web</text>
  <text x="112" y="376" text-anchor="middle" font-size="11" fill="#5C5A55">10.244.0.3</text>
  <text x="112" y="391" text-anchor="middle" font-size="11" fill="#5C5A55">Ready</text>
  <path d="M 427 254 C 427 282, 112 282, 112 312" stroke="#5B4FBE" stroke-width="2" fill="none" marker-end="url(#ok5B4FBE)"/>
  <rect x="240" y="314" width="168" height="92" rx="8" fill="#DDF0E5" stroke="#2A7D53" stroke-width="1.5"/>
  <text x="324" y="344" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A1A18">Pod B</text>
  <text x="324" y="361" text-anchor="middle" font-size="11" fill="#5C5A55">app=web</text>
  <text x="324" y="376" text-anchor="middle" font-size="11" fill="#5C5A55">10.244.0.4</text>
  <text x="324" y="391" text-anchor="middle" font-size="11" fill="#5C5A55">Ready</text>
  <path d="M 427 254 C 427 282, 324 282, 324 312" stroke="#5B4FBE" stroke-width="2" fill="none" marker-end="url(#ok5B4FBE)"/>
  <rect x="452" y="314" width="168" height="92" rx="8" fill="#F8DFDF" stroke="#B33A3A" stroke-width="1.5"/>
  <text x="536" y="344" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A1A18">Pod C</text>
  <text x="536" y="361" text-anchor="middle" font-size="11" fill="#5C5A55">app=web</text>
  <text x="536" y="376" text-anchor="middle" font-size="11" fill="#5C5A55">10.244.0.5</text>
  <text x="536" y="391" text-anchor="middle" font-size="11" fill="#5C5A55">NOT Ready</text>
  <rect x="664" y="314" width="168" height="92" rx="8" fill="#F8DFDF" stroke="#B33A3A" stroke-width="1.5"/>
  <text x="748" y="344" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A1A18">Pod D</text>
  <text x="748" y="361" text-anchor="middle" font-size="11" fill="#5C5A55">app=db</text>
  <text x="748" y="376" text-anchor="middle" font-size="11" fill="#5C5A55">10.244.0.6</text>
  <text x="748" y="391" text-anchor="middle" font-size="11" fill="#5C5A55">boshqa label</text>
  <rect x="28" y="424" width="804" height="30" rx="6" fill="#FBEBD2" stroke="#B5761A" stroke-width="1.5"/>
  <text x="430" y="445" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1A1A18">Ro&#x27;yxatga faqat 10.244.0.3 va 10.244.0.4 tushadi — Pod C hali tayyor emas, Pod D esa boshqa label bilan</text>
