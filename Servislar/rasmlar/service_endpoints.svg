<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860"
     role="img" aria-labelledby="sarlavha izoh" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title id="sarlavha">Service Pod&#x27;larni qanday topadi</title>
  <desc id="izoh">Service Pod&#x27;ni nomi bilan emas, label selektori bilan topadi. Mos keluvchi har bir tayyor Pod&#x27;ning IP manzili EndpointSlice ga yoziladi. kube-proxy shu ro&#x27;yxatga qarab har node&#x27;da iptables qoidasini yozadi — shuning uchun Service IP&#x27;siga kelgan paket to&#x27;g&#x27;ridan-to&#x27;g&#x27;ri Pod&#x27;ga yo&#x27;naltiriladi.</desc>
