  <title id="sarlavha">kubectl expose --type=LoadBalancer nima qiladi</title>
  <desc id="izoh">Bitta buyruq uchta qatlamni birdan yoqadi. LoadBalancer turidagi Service NodePort&#x27;ni, NodePort esa ClusterIP&#x27;ni o&#x27;z ichiga oladi — ya&#x27;ni ilovaga uch xil manzildan kirish mumkin bo&#x27;lib qoladi. minikube&#x27;da haqiqiy tashqi IP yo&#x27;q, shuning uchun uni minikube tunnel taqlid qiladi.</desc>
